<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Tabela Frutas</title>
</head>
<body>
    <table>
        <thead>
            <th>Name</th><th>Picture</th>
        </thead>
        <tbody>
            <tr>
                <td width="200" height="200">Apple</td><td><img src="img/apple.webp" width="200" height="200" alt="Apple"></td>
            </tr>
            <tr>
                <td width="200" height="200">Banana</td><td><img src="img/banana.webp" width="200" height="200" alt="Banana"></td>
            </tr>
            <tr>
                <td width="200" height="200">Peach</td><td><img src="img/peach.jpg" width="200" height="200" alt="Peach"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
