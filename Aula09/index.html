<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/style.css">
    <title>Authora</title>
</head>
<body>
    <header class="cabecalho">
        <div class="cabecalho-conteudo">
            <section class="comeco-cabecalho">
                <img href="#" src="../Aula09/IMG/Authora.logopretolaranja.jpg" width="120" style="cursor: pointer;">
                <a href="#" class="ativo">Cadastrar</a>
            </section>

            <section class="fim-cabecalho">
                <a href="#">
                    <img src="IMG/join.png" width="15" height="15">
                    <p>Login</p>
                </a>
            </section>
        </div>
        
    </header>

    <main class="cadastro">
        <div class="cadastro-titulo">
            <h1>Cadastro de novo usuário</h1>
        </div>

        <form id="formulario" class="conteiner">
            <div class="colunas">
                <div class="coluna">
                    <div class="coluna-titulo">
                        <p>Dados pessoais:</p>
                        <hr>
                    </div>

                    <div class="coluna-conteudo">
                        <div class="input">
                            <label for="nome">Nome</label>
                            <input type="text" id="nome" required>
                        </div>

                        <div class="input">
                            <label for="documento">Documento <small>(CPF/CNPJ)</small></label>
                            <input type="text" id="documento" maxlength="14" inputmode="numeric" required>
                        </div>

                        <div class="input">
                            <label for="email">Email</label>
                            <input type="email" id="email" required>
                        </div>

                        <div class="input">
                            <label for="empresa">Empresa</label>
                            <input type="text" id="empresa">
                        </div>

                        <div class="input">
                            <label for="telefone">Telefone</label>
                            <input type="text" maxlength="11" inputmode="numeric" id="telefone">
                        </div>

                        <div class="check-box">
                            <input type="checkbox" id="cliente">
                            <label for="cliente">Já sou cliente da LDSOFT</label>
                        </div>
                    </div>
                    
                    
                </div>

                <div class="coluna">
                    <div class="coluna-titulo">
                        <p>Dados de acesso:</p>
                        <hr>
                    </div>
                    <div class="coluna-conteudo">
                        <div class="input">
                            <label for="login">Login</label>
                            <input type="text" id="login" required>
                        </div>

                        <div class="input">
                            <label for="senha">Senha</label>
                            <input type="password" id="senha" required>
                        </div>

                        <div class="input">
                            <label for="confSenha">Confirmar Senha</label>
                            <input type="password" id="confSenha" required>
                        </div>

                        <div class="select">
                            <label for="pessoa">Tipo de pessoa</label>
                            <select id="pessoa" required>
                                <option value="" selected disabled>Selecione</option>
                                <option value="fisico">Pessoa Física</option>
                                <option value="escritorio">Pessoa Jurídica - Escritório de Adv/PI</option>
                                <option value="empresa">Pessoa Jurídica - Empresa</option>
                            </select>
                        </div>

                        <div class="select">
                            <label for="interesse">Área de interesse</label>

                            <select id="interesse" required>
                                <option value="" selected disabled>Selecione</option>
                                <option value="cancoes">Canções</option>
                                <option value="propaganda">Expressão de propaganda</option>
                                <option value="fotos">Fotos e ilustrações</option>
                                <option value="moda">Direito da moda</option>
                                <option value="outros">Outros</option>
                            </select>
                        </div>

                        <div class="check-box">
                            <input type="checkbox" id="termos">
                            <label for="termos">
                                Eu aceito os
                                <a href="https://ldaz-os-prd.ldsoft.com.br">termos de uso</a>
                                do sistema
                            </label>
                        </div>
                    </div>
                    
                </div>
            </div>

            <div class="botoes">
                <button type="submit" class="botao-salvar" id="salvar" disabled>Salvar</button>
                <button class="botao-cancelar" onclick="cancelar()">Cancelar</button>
            </div>
        </div>

    </main>

    <footer class="rodape">
        <a href="https://www.ldsoft.com.br/">
            <img src="../Aula09/IMG/Authora.loginlogoldsoft.png">
        </a>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
