<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/style.css">
    <title>Tela de Login</title>
</head>
<body>
    <main>
        <div class="conteiner-login">
            <form method="post">
                <h1>
                    <span class="h1-top">Bem vindo a </span>
                    <span class="h1-bottom">Fortaleza da Solidão.</span>
                </h1>
                <div>
                    <input type="text" placeholder="Digite seu usuário" id="usuario" required>
                    <input type="password" placeholder="Digite sua senha" id="senha" required>
                </div>
                <button type="button" onclick="validar()">Acessar</button>
            </form>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
