<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="shortcut icon" href="IMG/ClimatemaIcon.png" type="image/x-icon">
    <title>Climatema | Cadastro</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><img src="IMG/ClimatemaLogo.png" width="150"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="index.html">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cidades.html">Cidades</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="climas.html">Climas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="cadastro.html">Cadastro</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="pesquisa" placeholder="Pesquise aqui..." aria-label="Search"/>
                    <button class="btn btn-outline-success" type="submit">Buscar</button>
                </form>
            </div>
        </div>
    </nav>
    <main class="container pagina-conteudo">
        <div class="titulo">
            <h2>Cadastro</h2>
            <h1>Faça parte do <strong>Climatema.</strong></h1>
            <p>Preencha seus dados abaixo. Cadastro demonstrativo, sem envio ou armazenamento de dados.</p>
        </div>
        <form id="formulario-cadastro" class="formulario-cadastro border rounded p-4 p-md-5">
            <div class="mb-3">
                <label for="nome" class="form-label">Nome completo</label>
                <input type="text" class="form-control" id="nome" name="nome" autocomplete="name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
            </div>
            <div class="mb-4">
                <label for="cidade" class="form-label">Cidade</label>
                <select class="form-select" id="cidade" name="cidade" required>
                    <option value="" selected disabled>Selecione sua cidade</option>
                    <option value="americana">Americana</option>
                    <option value="santa-barbara">Santa Bárbara d'Oeste</option>
                    <option value="nova-odessa">Nova Odessa</option>
                    <option value="holambra">Holambra</option>
                    <option value="campinas">Campinas</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100" disabled>Cadastrar</button>
            <p id="cadastro-retorno" class="alert alert-success mt-4 mb-0 d-none" role="status">Formulário validado com sucesso! Este cadastro é demonstrativo; nenhum dado foi enviado ou salvo.</p>
            <noscript><p class="alert alert-warning mt-3 mb-0">Ative o JavaScript para usar o formulário demonstrativo.</p></noscript>
        </form>
    </main>
    <script src="JS/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
