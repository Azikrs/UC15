<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/style.css">
    <title>Java Script</title>
</head>
<body>
    <h1>Variável do tipo objeto</h1>
    <p id="dados">Dados do Carro: </p>


    <script type="text/javascript">
        var meuCarro = new Object();
        meuCarro.fabrica = 'Volkswagen';
        meuCarro.modelo = 'Jetta';
        meuCarro.cor = 'Azul';
        meuCarro.ano = 2024;

        document.getElementById('dados').innerHTML += meuCarro.fabrica + " - " + meuCarro.modelo + " - " + meuCarro.cor + " - " + meuCarro.ano;
    </script>
</body>
</html>
