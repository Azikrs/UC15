<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/style.css">
    <title>Java Script</title>
</head>
<body>
    <h1>Tipo de dados</h1>
    <p id="teste"></p>
    <p id="teste2"></p>
    <p id="teste3"></p>
    <p id="teste4"></p>
    <p id="teste5"></p>
    <p id="teste6"></p>
    <p id="teste7"></p>


    <script type="text/javascript">
        //criar variaveis

        var a; //texto + número
        var b = 1; //inteiro
        var c = [1,2,3,4,5]; //array - números
        var d = ['Verde', 'Amarelo', 'Azul', 'Branco']; //array - texyto
        var e = 'Senac'; //texto pré definido
        var f = false;// lógico, booleano, true e false
        var g = null; // vazio sem valor

        document.getElementById('teste').innerHTML = 'O valor de a é ' + a;
        document.getElementById('teste2').innerHTML = 'O valor de b é ' + b;
        document.getElementById('teste3').innerHTML = 'O valor de c é ' + c[2];
        document.getElementById('teste4').innerHTML = 'O valor de d é ' + d[2];
        document.getElementById('teste5').innerHTML = 'O valor de e é ' + e;
        document.getElementById('teste6').innerHTML = 'O valor de f é ' + f;
        document.getElementById('teste7').innerHTML = 'O valor de g é ' + g;

    </script>
</body>
</html>
