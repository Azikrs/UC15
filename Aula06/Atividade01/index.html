<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/img/Logo.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <title>Destino Brotas</title>
</head>
<body>
    <header class="cabecalho">
        <section id="pagina-home">
            <div class="categoria">
                <img src="./img/Logo.png" alt="logo da pousada destino brotas" class="logo">
                <nav>
                    <ul>
                        <li><a href="#" class="ativo">HOME</a></li>
                        <li><a href="#" class="btn-home">SERVIÇOS</a></li>
                        <li><a href="#" class="btn-home">GALERIA</a></li>
                        <li><a href="#" class="btn-home">CONTATO</a></li>
                    </ul>
                </nav>
            </div>

            <div class="conteudo-banner">
                <h1>Aventura e Tranquilidade</h1>
                <div class="conteudo-banner-botoes">
                    <a href="#">VIDEO</a>
                    <a href="#">LEIA MAIS</a>
                </div>
            </div>
        </section>
    </header>

    <main class="galeria">
        <section class="main">
            <h1>Passeios</h1>
            <div class="galeria-imagens">
                <figure class="fotos">
                    <img src="./img/foto1.png">
                    <figcaption class="legenda">Canoagem</figcaption>
                </figure>

                <figure class="fotos">
                    <img src="./img/foto2.png">
                    <figcaption class="legenda">Passeio Radical</figcaption>
                </figure>

                <figure class="fotos">
                    <img src="./img/foto3.png">
                    <figcaption class="legenda">Trilhas</figcaption>
                </figure>
            </div>
        </section>

    </main>
</body>
</html>
